# CAPRI forensics: parameter registry.
#
# Every value here is an initial DEFAULT, not a verified result. Each is to be
# tuned on the validation split only, never on test data; any change must be
# recorded here before test results are looked at (pre-registration). The
# config hash is written into every output record.

global:
  base_seed: 88000000           # 2026-10-19: fresh band for the forensic video study (was 42000)
  dtype: float64

ingest:
  geometry_resize: none         # never resample before geometric analysis
  min_short_side_px: 512
  video_sample_fps: 15            # 2026-10-19: was 5; a 6-view window (spacing 3) then spans ~1 s, which fits 2-4 s generated clips (set on val/cal only)
  max_frames_per_clip: 60         # 2026-10-19: was 150; at 15 fps the first 4 s of every clip, the length of the generated clips
  min_shot_len_frames: 16         # 2026-10-19: was 24; one window = (6 - 1) * 3 + 1 = 16 frames (set on val/cal only)
  shot_threshold: 27.0          # mean absolute HSV-histogram difference x 100

lines:
  lsd_scale: 0.8
  lsd_sigma_scale: 0.6
  lsd_quant: 2.0
  lsd_angle_tolerance_deg: 22.5
  lsd_density: 0.7
  min_len_frac: 0.03            # of the longer image side
  max_segments: 500
  edge_sigma_px: 0.7            # sigma_p, edge localization noise
  corr_length_px: 2.0           # l_c, correlation length of edge pixels
  max_sigma_theta_deg: 1.0

vanishing_points:
  k_max_families: 3
  ransac_iters: 2000
  inlier_angle_deg: 2.0
  min_fit_lines: 4
  bootstrap_b: 200
  assign_angle_deg: 3.0
  min_test_lines: 12

collinearity:
  min_len_frac_bend: 0.08
  min_support_px: 40
  max_sigma_theta_deg: 1.0

aggregation:
  null_model: empirical               # chi-square p-values are diagnostics only
  ece_bins: 10
  ece_min_bin_count: 50

video:
  tracker_grid: 20
  track_conf_min: 0.5           # forward-backward consistency score
  window_views: 6
  subset_a: [0, 2, 4]
  subset_b: [1, 3, 5]
  view_spacing: 3
  parallax_min_disp_frac: 0.02  # of the image diagonal
  parallax_min_f_over_h: 1.2
  ransac_threshold_px: 1.0
  ransac_confidence: 0.999
  rigid_inlier_frac: 0.8
  dynamic_outlier_frac: 0.30
  static_camera_disp_frac: 0.005
  pencils_per_window: 50000     # pencil drift statistic (docs/MATHEMATICS.md, Section 4)
  pencil_quantile: 0.1
  tuples_per_window: 200        # legacy (Delta_J on random 6-tuples), unused by the window statistic
  min_tracks_per_window: 20
  sigma4_min: 0.02             # legacy gate for Delta_J tuples (unused by the pencil statistic); 0.15
                               # rejects every tuple on synthetic data (median 0.015); tune on val
  kappa_quantile: 0.95          # legacy (kappa gate for Delta_J tuples)
  cusum_k: 0.5
  cusum_h: 5.0

gates:
  # Decision rules from Sections 1.5 and 8.1. Change only before seeing test data.
  real_media_null_nominal: 0.05
  real_media_null_band: [0.035, 0.065]
  heldout_image_min_auc: 0.70
  heldout_max_metadata_auc: 0.55
  heldout_video_min_auc: 0.70
