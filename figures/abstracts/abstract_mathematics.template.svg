<?xml version="1.0" encoding="UTF-8"?>
<!-- CAPRI graphical abstract: the mathematics (docs/MATHEMATICS.md).
     Layout made for Inkscape; edit this template, not abstract_mathematics.svg. Built by build.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1660" height="840" viewBox="0 0 1660 840">
  <defs>
    <style>
      text { font-family: Roboto, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #1f1f1f; }
      .sub { font-size: 20px; fill: #5f6368; }
      .head { font-size: 21px; font-weight: 500; fill: #202124; }
      .num { font-size: 21px; font-weight: 700; fill: #c5532f; }
      .body { font-size: 15.5px; fill: #3c4043; }
      .small { font-size: 13.5px; fill: #80868b; }
      .m { font-family: 'Latin Modern Roman', serif; font-style: italic; fill: #202124; }
      .r { font-family: 'Latin Modern Roman', serif; font-style: normal; }
      .panel { fill: #ffffff; stroke: #d5d7da; stroke-width: 2; }
      .capri { fill: #fdf0ea; stroke: #e9a68c; stroke-width: 2.5; }
      .chip { fill: #ffffff; stroke: #e9a68c; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1660" height="840" fill="#ffffff"/>

  <text x="30" y="52" class="title">The mathematics of CAPRI<tspan class="sub" dx="16" font-weight="400">Everything lives on a pencil of planes.</tspan></text>
  <text x="30" y="86" class="sub" font-size="17">Brackets <tspan class="m" font-size="20">[ijkl]</tspan><tspan class="r" font-size="20"> = det(</tspan><tspan class="m" font-size="20">p</tspan><tspan class="m" font-size="13" baseline-shift="sub">i</tspan><tspan class="r" font-size="20">, </tspan><tspan class="m" font-size="20">p</tspan><tspan class="m" font-size="13" baseline-shift="sub">j</tspan><tspan class="r" font-size="20">, </tspan><tspan class="m" font-size="20">p</tspan><tspan class="m" font-size="13" baseline-shift="sub">k</tspan><tspan class="r" font-size="20">, </tspan><tspan class="m" font-size="20">p</tspan><tspan class="m" font-size="13" baseline-shift="sub">l</tspan><tspan class="r" font-size="20">)</tspan> of <tspan class="m" font-size="20">n</tspan> points in <tspan class="r" font-size="20">ℙ³</tspan>. Gauge: <tspan class="m" font-size="20">p</tspan><tspan class="m" font-size="13" baseline-shift="sub">k</tspan><tspan class="r" font-size="20"> ↦ </tspan><tspan class="m" font-size="20">λ</tspan><tspan class="m" font-size="13" baseline-shift="sub">k</tspan><tspan class="m" font-size="20"> A p</tspan><tspan class="m" font-size="13" baseline-shift="sub">k</tspan> for any frame <tspan class="m" font-size="20">A</tspan> and any scales <tspan class="m" font-size="20">λ</tspan><tspan class="m" font-size="13" baseline-shift="sub">k</tspan>.</text>

  <!-- a invariants ........................................................................ -->
  <rect x="30" y="110" width="385" height="570" rx="18" class="panel"/>
  <text x="52" y="148" class="head"><tspan class="num">a</tspan><tspan dx="10">Invariants</tspan></text>
  <image xlink:href="assets/pencil_on_photo.png" x="52" y="168" width="160" height="240"/>
  <rect x="52" y="168" width="160" height="240" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="230" y="200" class="body">Four planes through</text>
  <text x="230" y="222" class="body">the line <tspan class="m" font-size="18">p</tspan><tspan class="m" font-size="12" baseline-shift="sub">i</tspan><tspan class="m" font-size="18">p</tspan><tspan class="m" font-size="12" baseline-shift="sub">j</tspan>, one through</text>
  <text x="230" y="244" class="body">each of <tspan class="m" font-size="18">p</tspan><tspan class="m" font-size="12" baseline-shift="sub">c</tspan>, <tspan class="m" font-size="18">p</tspan><tspan class="m" font-size="12" baseline-shift="sub">d</tspan>, <tspan class="m" font-size="18">p</tspan><tspan class="m" font-size="12" baseline-shift="sub">e</tspan>, <tspan class="m" font-size="18">p</tspan><tspan class="m" font-size="12" baseline-shift="sub">f</tspan>:</text>
  <text x="232" y="318" class="r" font-size="21">CR<tspan class="m" font-size="14" baseline-shift="sub">ij</tspan><tspan class="r">(</tspan><tspan class="m">c,d</tspan><tspan class="r">;</tspan><tspan class="m">e,f</tspan><tspan class="r">)</tspan></text>
  <text x="232" y="360" class="r" font-size="21">=</text>
  <text x="318" y="350" text-anchor="middle" class="m" font-size="20">[ijce] [ijdf]</text>
  <text x="318" y="380" text-anchor="middle" class="m" font-size="20">[ijcf] [ijde]</text>
  <line x1="256" y1="356" x2="382" y2="356" stroke="#202124" stroke-width="1.3"/>
  <text class="body">
    <tspan x="52" y="448">Unchanged by every gauge, sign included:</tspan>
    <tspan x="52" y="470"><tspan class="r" font-size="18">det </tspan><tspan class="m" font-size="18">A</tspan> and each <tspan class="m" font-size="18">λ</tspan><tspan class="m" font-size="12" baseline-shift="sub">k</tspan> cancel between the numerator</tspan>
    <tspan x="52" y="492">and the denominator. For six points, three</tspan>
    <tspan x="52" y="514">of them are the coordinates <tspan class="m" font-size="18">J</tspan>:</tspan>
  </text>
  <g class="m" font-size="18">
    <text x="72" y="556"><tspan>J</tspan><tspan class="r" font-size="12" baseline-shift="sub">1</tspan><tspan class="r"> = CR</tspan><tspan class="r" font-size="12" baseline-shift="sub">12</tspan><tspan class="r">(3, 6; 4, 5)</tspan></text>
    <text x="72" y="588"><tspan>J</tspan><tspan class="r" font-size="12" baseline-shift="sub">2</tspan><tspan class="r"> = CR</tspan><tspan class="r" font-size="12" baseline-shift="sub">34</tspan><tspan class="r">(1, 2; 5, 6)</tspan></text>
    <text x="72" y="620"><tspan>J</tspan><tspan class="r" font-size="12" baseline-shift="sub">3</tspan><tspan class="r"> = CR</tspan><tspan class="r" font-size="12" baseline-shift="sub">56</tspan><tspan class="r">(1, 4; 2, 3)</tspan></text>
  </g>
  <text x="52" y="660" class="small">Photo: four triangles share the edge <tspan class="m" font-size="16" fill="#80868b">p</tspan><tspan class="m" font-size="11" baseline-shift="sub" fill="#80868b">i</tspan><tspan class="m" font-size="16" fill="#80868b">p</tspan><tspan class="m" font-size="11" baseline-shift="sub" fill="#80868b">j</tspan> (white).</text>

  <!-- b Pluecker relations ................................................................ -->
  <rect x="435" y="110" width="385" height="570" rx="18" class="capri"/>
  <text x="457" y="148" class="head"><tspan class="num">b</tspan><tspan dx="10">Plücker relations</tspan></text>
  <g stroke-linejoin="round">
    <path d="M552,300 L552,170 L449,158 L449,288 Z" fill="#b5541a" fill-opacity="0.22" stroke="#b5541a" stroke-width="2"/>
    <path d="M552,300 L552,170 L658,179 L658,309 Z" fill="#8a4f7d" fill-opacity="0.22" stroke="#8a4f7d" stroke-width="2"/>
    <path d="M552,300 L552,170 L489,199 L489,329 Z" fill="#2a7f62" fill-opacity="0.22" stroke="#2a7f62" stroke-width="2"/>
    <path d="M552,300 L552,170 L590,203 L590,333 Z" fill="#3a6ea5" fill-opacity="0.22" stroke="#3a6ea5" stroke-width="2"/>
    <line x1="552" y1="300" x2="552" y2="170" stroke="#202124" stroke-width="4" stroke-linecap="round"/>
    <circle cx="552" cy="182" r="7" fill="#202124" stroke="#ffffff" stroke-width="2"/>
    <circle cx="552" cy="288" r="7" fill="#202124" stroke="#ffffff" stroke-width="2"/>
    <circle cx="632" cy="247" r="6.5" fill="#8a4f7d" stroke="#ffffff" stroke-width="2"/>
    <circle cx="580" cy="265" r="6.5" fill="#3a6ea5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="505" cy="262" r="6.5" fill="#2a7f62" stroke="#ffffff" stroke-width="2"/>
    <circle cx="475" cy="231" r="6.5" fill="#b5541a" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text x="532" y="186" text-anchor="end" class="m" font-size="18">p<tspan font-size="12" baseline-shift="sub">i</tspan></text>
  <text x="532" y="294" text-anchor="end" class="m" font-size="18">p<tspan font-size="12" baseline-shift="sub">j</tspan></text>
  <text class="body">
    <tspan x="678" y="200">On one pencil, the</tspan>
    <tspan x="678" y="222">brackets become</tspan>
    <tspan x="678" y="244">2×2 minors on <tspan class="r" font-size="18">ℙ¹</tspan>:</tspan>
    <tspan x="678" y="266">each plane is a</tspan>
    <tspan x="678" y="288">point of the line.</tspan>
  </text>
  <line x1="470" y1="372" x2="800" y2="372" stroke="#202124" stroke-width="2"/>
  <circle cx="500" cy="372" r="7" fill="#8a4f7d"/><text x="500" y="358" text-anchor="middle" class="m" font-size="19" fill="#8a4f7d">c</text>
  <circle cx="590" cy="372" r="7" fill="#3a6ea5"/><text x="590" y="358" text-anchor="middle" class="m" font-size="19" fill="#3a6ea5">d</text>
  <circle cx="690" cy="372" r="7" fill="#2a7f62"/><text x="690" y="358" text-anchor="middle" class="m" font-size="19" fill="#2a7f62">e</text>
  <circle cx="770" cy="372" r="7" fill="#b5541a"/><text x="770" y="358" text-anchor="middle" class="m" font-size="19" fill="#b5541a">f</text>
  <text x="627" y="438" text-anchor="middle" class="m" font-size="20">GP<tspan font-size="13" baseline-shift="sub">ab</tspan><tspan class="r"> = </tspan>[abcf] [abde] <tspan class="r">(1 − </tspan>λ<tspan class="r" font-size="13" baseline-shift="sub">1</tspan><tspan class="r"> − </tspan>λ<tspan class="r" font-size="13" baseline-shift="sub">2</tspan><tspan class="r">) ≡ 0</tspan></text>
  <rect x="537" y="456" width="180" height="40" rx="10" class="chip"/>
  <text x="627" y="483" text-anchor="middle" class="m" font-size="21">λ<tspan class="r"> + (1 − </tspan>λ<tspan class="r">) = 1</tspan></text>
  <text class="body">
    <tspan x="457" y="534">Each of the 15 relations is this identity on one</tspan>
    <tspan x="457" y="556">pencil. So the residual <tspan class="m" font-size="18">ρ</tspan> built from them is</tspan>
    <tspan x="457" y="578" font-weight="700">identically zero on one reconstruction.</tspan>
    <tspan x="457" y="610">Consistency must be judged <tspan font-style="italic">between</tspan> two</tspan>
    <tspan x="457" y="632">reconstructions of the same points.</tspan>
  </text>

  <!-- c completeness ...................................................................... -->
  <rect x="840" y="110" width="385" height="570" rx="18" class="panel"/>
  <text x="862" y="148" class="head"><tspan class="num">c</tspan><tspan dx="10">Completeness</tspan></text>
  <text class="body">
    <tspan x="862" y="190">The <tspan class="m" font-size="18">4n</tspan> coordinates of <tspan class="m" font-size="18">n</tspan> points split into the</tspan>
    <tspan x="862" y="212">gauge orbit and what the pencils see.</tspan>
  </text>
  <text x="1032" y="262" text-anchor="middle" class="body"><tspan class="m" font-size="18">n</tspan><tspan class="r" font-size="18"> = 12: 48 = 27 + 21</tspan></text>
  <path d="M862,282 v-8 h341 v8" fill="none" stroke="#5f6368" stroke-width="1.5"/>
  <rect x="862" y="290" width="192" height="46" rx="6" fill="#dadce0"/>
  <rect x="1054" y="290" width="149" height="46" rx="6" fill="#2a7f62"/>
  <rect x="1054" y="290" width="12" height="46" fill="#2a7f62"/>
  <text x="958" y="319" text-anchor="middle" class="body">gauge <tspan class="r" font-size="18">16 + </tspan><tspan class="m" font-size="18">n</tspan><tspan class="r" font-size="18"> − 1</tspan></text>
  <text x="1128" y="320" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="700"><tspan class="r" fill="#ffffff">3</tspan><tspan class="m" fill="#ffffff">n</tspan><tspan class="r" fill="#ffffff"> − 15</tspan></text>
  <text x="1032" y="398" text-anchor="middle" class="r" font-size="22">rank <tspan class="m">J</tspan>(log|CR<tspan class="m" font-size="14" baseline-shift="sub">t</tspan>|)<tspan class="m" font-size="14" baseline-shift="sub">t</tspan> = 3<tspan class="m">n</tspan> − 15</text>
  <text class="body">
    <tspan x="862" y="446">Exact computation modulo <tspan class="m" font-size="18">p</tspan><tspan class="r" font-size="18"> = 2⁶¹ − 1</tspan> for</tspan>
    <tspan x="862" y="468"><tspan class="m" font-size="18">n</tspan><tspan class="r" font-size="18"> = 6, 7, 8, 12</tspan> (ranks <tspan class="r" font-size="18">3, 6, 9, 21</tspan>).</tspan>
    <tspan x="862" y="506">Near a generic configuration, equal pencil</tspan>
    <tspan x="862" y="528">cross-ratios ⇔ the same points up to the gauge.</tspan>
    <tspan x="862" y="550">The family detects every change that is not</tspan>
    <tspan x="862" y="572">a change of frame.</tspan>
  </text>
  <rect x="862" y="596" width="341" height="44" rx="10" fill="#f5f6f7"/>
  <text x="1032" y="624" text-anchor="middle" class="body">Six points carry only three numbers: <tspan class="m" font-size="18">J</tspan><tspan class="r" font-size="12" baseline-shift="sub">1</tspan>, <tspan class="m" font-size="18">J</tspan><tspan class="r" font-size="12" baseline-shift="sub">2</tspan>, <tspan class="m" font-size="18">J</tspan><tspan class="r" font-size="12" baseline-shift="sub">3</tspan>.</text>

  <!-- d test and conditioning ............................................................. -->
  <rect x="1245" y="110" width="385" height="570" rx="18" class="panel"/>
  <text x="1267" y="148" class="head"><tspan class="num">d</tspan><tspan dx="10">Test and conditioning</tspan></text>
  <text x="1267" y="190" class="body">Consistency statistic of two measurements:</text>
  <text x="1437" y="232" text-anchor="middle" class="m" font-size="21">S<tspan class="r"> = </tspan>Q<tspan class="r" font-size="14" baseline-shift="sub">0.1</tspan><tspan class="r">({</tspan>D<tspan font-size="14" baseline-shift="sub">t</tspan><tspan class="r">}) = </tspan>(r / δ) Z<tspan class="r"> + O(</tspan>r<tspan class="r" font-size="14" baseline-shift="super">2</tspan><tspan class="r">)</tspan></text>
  <text class="body">
    <tspan x="1267" y="272">One threshold serves every noise scale. The low</tspan>
    <tspan x="1267" y="294">quantile follows the harmonic mean <tspan class="m" font-size="18">H</tspan> of the</tspan>
    <tspan x="1267" y="316">per-pencil scales:</tspan>
  </text>
  <text x="1437" y="356" text-anchor="middle" class="m" font-size="21">x<tspan font-size="14" baseline-shift="sub">p</tspan><tspan class="r"> / (</tspan>p<tspan class="r"> √(π/2) </tspan>H<tspan class="r">) → 1</tspan></text>
  <line x1="1267" y1="384" x2="1608" y2="384" stroke="#e3e5e8" stroke-width="1.5"/>
  <text x="1267" y="416" class="body">Conditioning of the coordinates <tspan class="m" font-size="18">J</tspan>:</text>
  <text x="1437" y="456" text-anchor="middle" class="m" font-size="21">κ<tspan font-size="14" baseline-shift="sub">J</tspan><tspan class="r"> = max</tspan><tspan font-size="14" baseline-shift="sub">k</tspan><tspan class="r"> ‖∇ log|</tspan>J<tspan font-size="14" baseline-shift="sub">k</tspan><tspan class="r">|‖</tspan></text>
  <text x="1437" y="496" text-anchor="middle" class="m" font-size="20"><tspan class="r">0.674 </tspan>σκ<tspan font-size="13" baseline-shift="sub">J</tspan><tspan class="r"> ≤ med(</tspan>M<tspan class="r">) ≤ 1.383 </tspan>σκ<tspan font-size="13" baseline-shift="sub">J</tspan></text>
  <text x="1437" y="534" text-anchor="middle" class="m" font-size="20">κ<tspan font-size="13" baseline-shift="sub">J</tspan><tspan class="r"> ≤ 8 / </tspan>δ<tspan font-size="13" baseline-shift="sub">J</tspan><tspan class="r"> ≤ 2√(2</tspan>L<tspan class="r">(</tspan>S<tspan class="r">))</tspan></text>
  <text class="body">
    <tspan x="1267" y="576">First order (<tspan class="m" font-size="18">σκ</tspan><tspan class="m" font-size="12" baseline-shift="sub">J</tspan><tspan class="r" font-size="18"> ≪ 1</tspan>). Tuple selection is</tspan>
    <tspan x="1267" y="598">maximum coverage: greedy reaches</tspan>
    <tspan x="1267" y="620"><tspan class="r" font-size="18">≥ (1 − 1/</tspan><tspan class="m" font-size="18">e</tspan><tspan class="r" font-size="18">) OPT</tspan>.</tspan>
  </text>

  <!-- status band ......................................................................... -->
  <rect x="30" y="700" width="1600" height="112" rx="18" fill="#f5f6f7"/>
  <text x="52" y="734" class="head" font-size="18">Status of each claim</text>
  <text class="body">
    <tspan x="52" y="762"><tspan font-weight="700">Proved:</tspan> gauge invariance, <tspan class="m" font-size="18">J</tspan> as pencil cross-ratios, the Plücker identity, <tspan class="m" font-size="18">ρ</tspan><tspan class="r" font-size="18"> ≡ 0</tspan>, the scale law, the harmonic-mean limit, the <tspan class="m" font-size="18">κ</tspan><tspan class="m" font-size="12" baseline-shift="sub">J</tspan> bounds, the codimension <tspan class="m" font-size="18">m</tspan><tspan class="r" font-size="18"> − 3</tspan> of the coplanar strata.</tspan>
    <tspan x="52" y="788"><tspan font-weight="700">Computer-assisted:</tspan> the rank <tspan class="r" font-size="18">3</tspan><tspan class="m" font-size="18">n</tspan><tspan class="r" font-size="18"> − 15</tspan> (exact, modulo a prime).   <tspan font-weight="700">Checked:</tspan> every claim has a test that can fail (verify_pencil.py, test_math_lock.py). No novelty is claimed.</tspan>
  </text>
</svg>
